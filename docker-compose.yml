# Production stack: PostgreSQL + one-shot migrations + the app (+ optional Caddy for TLS).
#   cp .env.example .env   # then edit
#   docker compose up -d --build
#   docker compose run --rm migrate npm run admin:create -- --email you@company.al --name "You"
name: giveaway

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-giveaway}
      POSTGRES_USER: ${POSTGRES_USER:-giveaway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published on the host: only reachable from the app containers.

  migrate:
    build: { context: ., target: migrate }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-giveaway}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-giveaway}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: { context: ., target: runtime }
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-giveaway}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-giveaway}
      TRUST_PROXY: "true"
    volumes:
      - uploads:/app/storage/uploads
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    # Bound to localhost only; the reverse proxy (Caddy/Nginx) terminates TLS in front of it.
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [app]

volumes:
  pgdata:
  uploads:
  caddy_data:
