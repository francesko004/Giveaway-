# Example Nginx site (if you prefer Nginx over Caddy). TLS via certbot or Cloudflare origin certificates.
server {
    listen 443 ssl http2;
    server_name giveaway.example.al;

    ssl_certificate     /etc/ssl/giveaway/origin.pem;
    ssl_certificate_key /etc/ssl/giveaway/origin.key;

    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cloudflare already sends CF-Connecting-IP; restrict origin access to Cloudflare IP ranges.
    }
}
server {
    listen 80;
    server_name giveaway.example.al;
    return 301 https://$host$request_uri;
}
