name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/giveaway_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/giveaway_test
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/giveaway_e2e
      APP_URL: http://localhost:3000
      SESSION_SECRET: ci-secret-ci-secret-ci-secret-0123456789abc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: |
          psql postgresql://postgres:postgres@localhost:5432/postgres -c "create database giveaway_test" -c "create database giveaway_e2e"
      - run: npx prisma generate && npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
